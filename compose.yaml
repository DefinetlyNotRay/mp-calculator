services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mp_optimizer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mp_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mp_optimizer"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mp_database:
